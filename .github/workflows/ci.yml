name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test build-logic
        run: ./gradlew -p build-logic test

      # 모듈을 만드는 태스크에서 아래 명령에 추가합니다:
      #   :core:testing:test verifyRoborazziDebug
      - name: Check, build and test
        run: ./gradlew spotlessCheck checkModuleRules assembleDebug lintDebug testDebugUnitTest :core:model:test :core:domain:test

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-outputs
          path: '**/build/outputs/roborazzi'
          if-no-files-found: ignore
